Conditions:
  PartitionIsUSGovCloud: !Equals [!Ref AWS::Partition, aws-us-gov]
Resources:
  InstallerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: HotsockInstallerRole
      Path: /hotsock/
      Description: Allows CloudFormation to manage Hotsock installations with appropriate permissions.
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - !Sub cloudformation.${AWS::URLSuffix}
      ManagedPolicyArns:
        - !Ref MaximumPermissionsPolicy
        - !Ref IAMPermissionsPolicy
      Tags:
        - Key: hotsock:service
          Value: Hotsock
  SupportRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: HotsockSupportRole
      Path: /hotsock/
      Description: Allows Hotsock support staff to access your account to triage issues upon your request. Access is denied by default with an expired date condition in the assume role trust relationship, which must be set to a date in the future to grant access.
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              AWS:
                !If [
                  PartitionIsUSGovCloud,
                  arn:aws-us-gov:iam::282774566237:root,
                  arn:aws:iam::080825576347:root,
                ]
            Condition:
              DateLessThanEquals:
                aws:CurrentTime: "2024-01-01T00:00:00Z"
      ManagedPolicyArns:
        - !Ref MaximumPermissionsPolicy
        - !Ref IAMPermissionsPolicy
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSCloudTrail_ReadOnlyAccess
      Tags:
        - Key: hotsock:service
          Value: Hotsock
  LicensingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: HotsockLicensingRole
      Path: /hotsock/
      Description: Allows Hotsock to perform licensing operations and collect usage data for installation metering.
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              AWS:
                !If [
                  PartitionIsUSGovCloud,
                  arn:aws-us-gov:iam::282774566237:root,
                  arn:aws:iam::080825576347:root,
                ]
      PermissionsBoundary: !Ref MaximumPermissionsPolicy
      Policies:
        - PolicyName: DescribeOrganization
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: organizations:DescribeOrganization
                Resource: "*"
        - PolicyName: CloudWatchApiGatewayMetrics
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:GetMetricWidgetImage
                Resource: "*"
        - PolicyName: CloudWatchPutMetricData
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringLike:
                    cloudwatch:namespace: Hotsock/*
        - PolicyName: LicensingABAC
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/hotsock:licensing: Allow
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:PutParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:*:${AWS::AccountId}:parameter/hotsock/licensing/*
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:DeleteItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:BatchGetItem
                  - dynamodb:ConditionCheckItem
                Resource: "*"
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys:
                      - installation
                      - licensing
                  StringEquals:
                    aws:ResourceTag/hotsock:service: Hotsock
      Tags:
        - Key: hotsock:service
          Value: Hotsock
  IAMPermissionsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Grants limited IAM access to Hotsock installer and support roles with path and Permissions Boundary requirement
      ManagedPolicyName: HotsockIAMPermissions
      Path: /hotsock/
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - iam:EnableOutboundWebIdentityFederation
              - iam:GenerateCredentialReport
              - iam:GenerateServiceLastAccessedDetails
              - iam:Get*
              - iam:List*
              - iam:SimulateCustomPolicy
              - iam:SimulatePrincipalPolicy
            Resource: "*"
          - Effect: Allow
            Action:
              - iam:CreatePolicy
              - iam:CreatePolicyVersion
              - iam:DeletePolicy
              - iam:DeletePolicyVersion
              - iam:DeleteRole
              - iam:SetDefaultPolicyVersion
              - iam:TagRole
              - iam:TagPolicy
              - iam:UntagRole
              - iam:UntagPolicy
              - iam:UpdateAssumeRolePolicy
              - iam:UpdateRole
              - iam:UpdateRoleDescription
              - iam:PassRole
            Resource:
              - !Sub arn:${AWS::Partition}:iam::*:role/hotsock/*
              - !Sub arn:${AWS::Partition}:iam::*:policy/hotsock/*
          # Roles can only be created with the permissions boundary, and the
          # permissions of a role can only be changed while it has the boundary.
          # A role without it (like HotsockInstallerRole and HotsockSupportRole)
          # would get the full, unbounded effect of any policy added to it.
          - Effect: Allow
            Action:
              - iam:AttachRolePolicy
              - iam:CreateRole
              - iam:DeleteRolePolicy
              - iam:DetachRolePolicy
              - iam:PutRolePermissionsBoundary
              - iam:PutRolePolicy
            Resource: !Sub arn:${AWS::Partition}:iam::*:role/hotsock/*
            Condition:
              StringEquals:
                iam:PermissionsBoundary: !Ref MaximumPermissionsPolicy
          - Effect: Deny
            Action: iam:DeleteRolePermissionsBoundary
            Resource: "*"
            Condition:
              StringEquals:
                iam:PermissionsBoundary: !Ref MaximumPermissionsPolicy
          # The roles and policies in this template are managed only by whoever
          # deploys this stack. The roles they are attached to can never change
          # their own permissions, who can assume them, or the boundary itself.
          - Effect: Deny
            Action:
              - iam:AttachRolePolicy
              - iam:DeleteRole
              - iam:DeleteRolePermissionsBoundary
              - iam:DeleteRolePolicy
              - iam:DetachRolePolicy
              - iam:PutRolePermissionsBoundary
              - iam:PutRolePolicy
              - iam:TagRole
              - iam:UntagRole
              - iam:UpdateAssumeRolePolicy
              - iam:UpdateRole
              - iam:UpdateRoleDescription
            Resource:
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/hotsock/HotsockInstallerRole
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/hotsock/HotsockSupportRole
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/hotsock/HotsockLicensingRole
          - Effect: Deny
            Action:
              - iam:CreatePolicyVersion
              - iam:DeletePolicy
              - iam:DeletePolicyVersion
              - iam:SetDefaultPolicyVersion
              - iam:TagPolicy
              - iam:UntagPolicy
            Resource:
              - !Ref MaximumPermissionsPolicy
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/hotsock/HotsockIAMPermissions
  MaximumPermissionsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Grants maximum permissions needed for Hotsock
      ManagedPolicyName: HotsockMaximumPermissions
      Path: /hotsock/
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: AllowServicesWildcards
            Effect: Allow
            Action:
              - apigateway:*
              - appconfig:*
              - application-autoscaling:*
              - applicationinsights:*
              - athena:*
              - autoscaling:*
              - cloudformation:*
              - cloudfront:*
              - cloudfront-keyvaluestore:*
              - cloudwatch:*
              - dax:*
              - dsql:*
              - dynamodb:*
              - ec2:*
              - ec2messages:*
              - ecr:*
              - ecr-public:*
              - ecs:*
              - elasticache:*
              - elasticfilesystem:*
              - elasticloadbalancing:*
              - events:*
              - evidently:*
              - execute-api:*
              - firehose:*
              - health:*
              - kinesis:*
              - lambda:*
              - logs:*
              - memorydb:*
              - pipes:*
              - s3:*
              - s3-object-lambda:*
              - scheduler:*
              - schemas:*
              - serverlessrepo:*
              - sns:*
              - sqs:*
              - ssm:*
              - states:*
              - sts:*
              - tag:*
              - vpc-lattice:*
              - vpc-lattice-svcs:*
              - wafv2:*
              - xray:*
            Resource: "*"
          - Sid: DenyReservationPurchases
            Effect: Deny
            Action:
              - dynamodb:PurchaseReservedCapacityOfferings
              - ec2:*Reserved*
              - ec2:*Reservation*
              - ec2:Purchase*
              - ec2:RunInstances
              - elasticache:PurchaseReservedCacheNodesOffering
              - es:PurchaseReserved*
              - memorydb:PurchaseReservedNodesOffering
              - rds:PurchaseReservedDBInstancesOffering
              - redshift:AcceptReservedNodeExchange
              - redshift:PurchaseReservedNodeOffering
              - savingsplans:*
            Resource: "*"
          - Sid: DenyAssumingRolesOutsideHotsockPath
            Effect: Deny
            Action:
              - sts:AssumeRole
              - sts:AssumeRoot
            NotResource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/hotsock/*
          - Sid: AllowPassingRoles
            Effect: Allow
            Action: iam:PassRole
            Resource: !Sub arn:${AWS::Partition}:iam::*:role/hotsock/*
          - Sid: AllowCreatingServiceLinkedRoles
            Effect: Allow
            Action: iam:CreateServiceLinkedRole
            Resource: "*"
          - Sid: AllowOutboundWebIdentityFederation
            Effect: Allow
            Action:
              - iam:EnableOutboundWebIdentityFederation
              - iam:GetOutboundWebIdentityFederationInfo
            Resource: "*"
          - Sid: AllowOrgInfo
            Effect: Allow
            Action: organizations:DescribeOrganization
            Resource: "*"
          - Sid: AllowKMSReadOnlyActions
            Effect: Allow
            Action:
              - kms:DescribeKey
              - kms:GenerateRandom
              - kms:List*
            Resource: "*"
          - Sid: AllowKMSTaggedKeyManagement
            Effect: Allow
            Action:
              - kms:CancelKeyDeletion
              - kms:CreateAlias
              - kms:CreateGrant
              - kms:Decrypt
              - kms:DeleteAlias
              - kms:DeriveSharedSecret
              - kms:Disable*
              - kms:Enable*
              - kms:Encrypt
              - kms:Generate*
              - kms:Get*
              - kms:Put*
              - kms:ReEncrypt*
              - kms:ReplicateKey
              - kms:RetireGrant
              - kms:RevokeGrant
              - kms:RotateKeyOnDemand
              - kms:ScheduleKeyDeletion
              - kms:Sign
              - kms:SynchronizeMultiRegionKey
              - kms:UpdateAlias
              - kms:UpdateKeyDescription
              - kms:UpdatePrimaryRegion
              - kms:Verify*
            Resource: "*"
            Condition:
              StringEquals:
                aws:ResourceTag/hotsock:service: Hotsock
          # Alias operations are authorized against the alias and against every
          # key involved. This only covers the alias, which must be named
          # alias/hotsock/*; the keys must still pass the tag condition in
          # AllowKMSTaggedKeyManagement.
          - Sid: AllowKMSAliasesForTaggedKeys
            Effect: Allow
            Action:
              - kms:CreateAlias
              - kms:DeleteAlias
              - kms:UpdateAlias
            Resource: !Sub arn:${AWS::Partition}:kms:*:${AWS::AccountId}:alias/hotsock/*
          - Sid: AllowKMSTaggedKeyCreation
            Effect: Allow
            Action:
              - kms:CreateKey
              - kms:TagResource
            Resource: "*"
            Condition:
              ForAnyValue:StringEquals:
                aws:RequestTag/hotsock:service: Hotsock
          - Sid: AllowKMSKeyTaggingOfOwnKeysWithOtherTags
            Effect: Allow
            Action: kms:TagResource
            Resource: "*"
            Condition:
              StringEquals:
                aws:ResourceTag/hotsock:service: Hotsock
          - Sid: AllowUntaggingOfOwnKeysWithOtherTags
            Effect: Allow
            Action: kms:UntagResource
            Resource: "*"
            Condition:
              StringEquals:
                aws:ResourceTag/hotsock:service: Hotsock
              ForAllValues:StringNotEquals:
                aws:TagKeys: [hotsock:service]
          - Sid: DenyKMSKeyTaggingInvalidTagValue
            Effect: Deny
            Action: kms:TagResource
            Resource: "*"
            Condition:
              StringNotEquals:
                aws:ResourceTag/hotsock:service: Hotsock
          - Sid: DenyKMSKeyTaggingInvalidChangeValue
            Effect: Deny
            Action: kms:TagResource
            Resource: "*"
            Condition:
              ForAnyValue:StringNotEquals:
                aws:RequestTag/hotsock:service: Hotsock
          - Sid: DenyKMSKeyTaggingMissingTag
            Effect: Deny
            Action: kms:TagResource
            Resource: "*"
            Condition:
              "Null":
                aws:ResourceTag/hotsock:service: true
Mappings:
  MetaMap:
    Global:
      Version: "1.0"
Outputs:
  Version:
    Value: !FindInMap [MetaMap, Global, Version]
